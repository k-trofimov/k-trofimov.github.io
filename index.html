;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --bg: #ffffff;\n    --ink: #111111;\n    --muted: #6a6a6a;\n    --display: 'Cormorant Garamond', 'Times New Roman', serif;\n    --body: 'Inter', -apple-system, sans-serif;\n  }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html { scroll-behavior: smooth; }\n\n  body {\n    background: var(--bg);\n    color: var(--ink);\n    font-family: var(--body);\n    font-weight: 300;\n    line-height: 1.65;\n    -webkit-font-smoothing: antialiased;\n    -moz-osx-font-smoothing: grayscale;\n    overflow-x: hidden;\n  }\n\n  img {\n    display: block;\n    max-width: 100%;\n    height: auto;\n    filter: grayscale(100%) contrast(1.02);\n  }\n\n  .wrap {\n    max-width: 760px;\n    margin: 0 auto;\n    padding: 0 28px;\n  }\n\n  /* HERO */\n  .hero {\n    padding: 48px 0 24px;\n    text-align: center;\n    opacity: 0;\n    animation: fadeUp 1s ease 0.1s forwards;\n  }\n\n  .hero__eyebrow {\n    font-size: 10px;\n    letter-spacing: 0.32em;\n    text-transform: uppercase;\n    color: var(--muted);\n    margin-bottom: 28px;\n  }\n\n  .hero__title {\n    font-family: var(--display);\n    font-weight: 300;\n    font-size: clamp(34px, 5.6vw, 60px);\n    line-height: 1;\n    letter-spacing: -0.01em;\n  }\n\n  .hero__title .sub {\n    display: block;\n    font-weight: 500;\n    font-size: 0.58em;\n    color: var(--ink);\n    letter-spacing: 0.01em;\n    margin-top: 14px;\n  }\n\n  /* Photos */\n  .photo {\n    margin: 36px 0;\n    opacity: 0;\n    animation: fadeUp 1s ease 0.3s forwards;\n  }\n\n  .photo img {\n    width: 100%;\n    aspect-ratio: 3/2;\n    object-fit: cover;\n  }\n\n  .photo--mid {\n    margin: 56px 0;\n  }\n\n  .photo--bleed {\n    width: 100%;\n    margin: 0;\n    padding: 0;\n  }\n\n  .photo--bleed img {\n    aspect-ratio: 16/10;\n  }\n\n  /* Doodles */\n  .doodle {\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    gap: 22px;\n    margin: 22px 0 14px;\n  }\n\n  .doodle svg { display: block; overflow: visible; }\n\n  /* Sections */\n  section.block {\n    padding: 28px 0;\n    text-align: center;\n  }\n\n  .block__title {\n    font-family: var(--display);\n    font-weight: 500;\n    font-size: clamp(28px, 3.6vw, 36px);\n    line-height: 1.15;\n    letter-spacing: -0.01em;\n    margin-bottom: 18px;\n    color: var(--ink);\n  }\n\n  .block__text {\n    font-size: 15px;\n    line-height: 1.75;\n    color: #222;\n    max-width: 520px;\n    margin: 0 auto;\n  }\n\n  .block__text + .block__text { margin-top: 14px; }\n\n  .intro-text {\n    font-family: var(--display);\n    font-weight: 400;\n    font-size: 20px;\n    line-height: 1.55;\n    color: var(--ink);\n    max-width: 580px;\n    margin: 0 auto;\n  }\n\n  .big-date {\n    font-family: var(--display);\n    font-weight: 300;\n    font-size: clamp(34px, 5.4vw, 56px);\n    letter-spacing: 0.02em;\n    line-height: 1.1;\n    color: var(--ink);\n  }\n\n  /* PROGRAM */\n  .program {\n    list-style: none;\n    max-width: 560px;\n    margin: 18px auto 0;\n    text-align: left;\n  }\n\n  .program li {\n    display: grid;\n    grid-template-columns: 120px 1fr;\n    gap: 24px;\n    padding: 18px 0;\n    border-top: 1px solid rgba(17, 17, 17, 0.14);\n  }\n\n  .program li:last-child { border-bottom: 1px solid rgba(17, 17, 17, 0.14); }\n\n  .program__date {\n    font-family: var(--display);\n    font-weight: 500;\n    font-size: 17px;\n    color: var(--ink);\n    line-height: 1.4;\n  }\n\n  .program__desc {\n    font-size: 14.5px;\n    line-height: 1.6;\n    color: #222;\n  }\n\n  /* COUNTDOWN */\n  .countdown {\n    padding: 40px 0 24px;\n    text-align: center;\n  }\n\n  .countdown__grid {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 4px;\n    max-width: 520px;\n    margin: 18px auto 0;\n  }\n\n  .countdown__cell {\n    padding: 22px 4px;\n    border: 1px solid rgba(17, 17, 17, 0.18);\n  }\n\n  .countdown__num {\n    font-family: var(--display);\n    font-weight: 300;\n    font-size: clamp(34px, 5.6vw, 56px);\n    line-height: 1;\n    letter-spacing: -0.02em;\n    display: block;\n    margin-bottom: 8px;\n    font-variant-numeric: tabular-nums;\n    color: var(--ink);\n  }\n\n  .countdown__unit {\n    font-size: 9px;\n    letter-spacing: 0.24em;\n    text-transform: uppercase;\n    color: var(--muted);\n  }\n\n  .countdown__date {\n    font-family: var(--display);\n    font-weight: 500;\n    font-size: 18px;\n    margin-top: 28px;\n    color: var(--ink);\n  }\n\n  /* FOOTER */\n  footer {\n    padding: 40px 0 56px;\n    text-align: center;\n  }\n\n  footer .sig {\n    font-family: var(--display);\n    font-weight: 500;\n    font-size: 22px;\n    color: var(--ink);\n    margin-top: 12px;\n  }\n\n  @keyframes fadeUp {\n    from { opacity: 0; transform: translateY(16px); }\n    to { opacity: 1; transform: translateY(0); }\n  }\n\n  .reveal {\n    opacity: 0;\n    transform: translateY(18px);\n    transition: opacity 0.8s ease, transform 0.8s ease;\n  }\n  .reveal.in { opacity: 1; transform: translateY(0); }\n\n  @media (max-width: 640px) {\n    .wrap { padding: 0 22px; }\n    .hero { padding: 36px 0 16px; }\n    .photo { margin: 28px 0; }\n    .photo--mid { margin: 40px 0; }\n    section.block { padding: 24px 0; }\n    .program li {\n      grid-template-columns: 1fr;\n      gap: 4px;\n      padding: 14px 0;\n    }\n    .program__date { font-size: 15px; }\n    .countdown__cell { padding: 16px 2px; }\n    .countdown__num { font-size: 32px; }\n    .doodle { gap: 14px; margin: 18px 0 10px; }\n    footer { padding: 32px 0 44px; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"wrap\">\n\n  <!-- HERO -->\n  <header class=\"hero\">\n    <div class=\"hero__eyebrow\">18 — 20 сентября 2026 · озеро Севан<\u002Fdiv>\n    <h1 class=\"hero__title\">\n      Свадьба\n      <span class=\"sub\">Кости и Насти<\u002Fspan>\n    <\u002Fh1>\n  <\u002Fheader>\n\n<\u002Fdiv>\n\n<!-- Photo 1 — full bleed -->\n<div class=\"photo photo--bleed\">\n  <img src=\"c638c328-8382-486d-b4af-6f549edc14c3\" alt=\"Костя и Настя\">\n<\u002Fdiv>\n\n<div class=\"wrap\">\n\n  <!-- Intro -->\n  <section class=\"block\">\n    <p class=\"intro-text\">\n      Спустя пару лет совместных скитаний мы приняли решение, что хотим дальше продолжать их только вместе. Праздновать это событие — свадьбу — планируем в кругу самых дорогих и близких нам людей, поэтому ваше присутствие очень важно для нас.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- doodle: fish row -->\n  <div class=\"doodle reveal\">\n    <svg width=\"70\" height=\"22\" viewBox=\"0 0 70 22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M4 11 C 10 4, 30 4, 46 11 C 30 18, 10 18, 4 11 Z\"><\u002Fpath>\n      <path d=\"M46 11 L58 5 L58 17 Z\"><\u002Fpath>\n      <circle cx=\"14\" cy=\"10\" r=\"0.8\" fill=\"#111\"><\u002Fcircle>\n      <path d=\"M22 9 C 25 11, 28 11, 32 9\"><\u002Fpath>\n    <\u002Fsvg>\n    <svg width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M11 4 C 7 7, 7 11, 11 11 C 15 11, 15 7, 11 4 Z M11 11 C 7 14, 7 18, 11 18 C 15 18, 15 14, 11 11 Z\" fill=\"#111\"><\u002Fpath>\n    <\u002Fsvg>\n    <svg width=\"70\" height=\"22\" viewBox=\"0 0 70 22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M66 11 C 60 4, 40 4, 24 11 C 40 18, 60 18, 66 11 Z\"><\u002Fpath>\n      <path d=\"M24 11 L12 5 L12 17 Z\"><\u002Fpath>\n      <circle cx=\"56\" cy=\"10\" r=\"0.8\" fill=\"#111\"><\u002Fcircle>\n      <path d=\"M48 9 C 45 11, 42 11, 38 9\"><\u002Fpath>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <!-- DATES -->\n  <section class=\"block reveal\">\n    <h2 class=\"block__title\">Даты<\u002Fh2>\n    <div class=\"big-date\">18.09 — 20.09.2026<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- doodle: wave -->\n  <div class=\"doodle reveal\">\n    <svg width=\"220\" height=\"20\" viewBox=\"0 0 220 20\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.1\" stroke-linecap=\"round\">\n      <path d=\"M2 10 Q 14 2, 26 10 T 50 10 T 74 10 T 98 10 T 122 10 T 146 10 T 170 10 T 194 10 T 218 10\"><\u002Fpath>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <!-- LOCATION -->\n  <section class=\"block reveal\">\n    <h2 class=\"block__title\">Локация<\u002Fh2>\n    <p class=\"block__text\">\n      Свадьба пройдёт в зоне отдыха All Seasons на озере Севан. От аэропорта в Ереване дорога до All Seasons занимает примерно 1,5 часа.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- doodle: plane (before Трансфер) -->\n  <div class=\"doodle reveal\">\n    <svg width=\"220\" height=\"40\" viewBox=\"0 0 220 40\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M10 32 Q 110 -4, 200 22\" stroke-dasharray=\"2,4\"><\u002Fpath>\n      <g transform=\"translate(196 19) rotate(28)\">\n        <path d=\"M0 0 L14 4 L0 8 L3 4 Z\" fill=\"#111\"><\u002Fpath>\n        <path d=\"M3 4 L-2 0 M3 4 L-2 8\"><\u002Fpath>\n      <\u002Fg>\n      <circle cx=\"10\" cy=\"32\" r=\"1.6\" fill=\"#111\"><\u002Fcircle>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <!-- TRANSFER -->\n  <section class=\"block reveal\">\n    <h2 class=\"block__title\">Трансфер<\u002Fh2>\n    <p class=\"block__text\">\n      Мы организуем несколько трансферов из аэропорта в течение дня. Будет здорово, если вы сможете прилететь в Ереван в интервале с 12:00 до 16:00, если позже — что-нибудь придумаем.\n    <\u002Fp>\n    <p class=\"block__text\">\n      Пожалуйста, напишите нам, как купите билеты — мы всё устроим так, чтобы вам не нужно было долго ждать трансфер.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- doodle: glasses cheers (before Программа) -->\n  <div class=\"doodle reveal\">\n    <svg width=\"80\" height=\"50\" viewBox=\"0 0 80 50\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M14 4 L26 4 L24 18 C 24 24, 18 24, 16 18 Z\"><\u002Fpath>\n      <path d=\"M20 24 L20 42\"><\u002Fpath>\n      <path d=\"M14 44 L26 44\"><\u002Fpath>\n      <path d=\"M54 4 L66 4 L64 18 C 64 24, 58 24, 56 18 Z\"><\u002Fpath>\n      <path d=\"M60 24 L60 42\"><\u002Fpath>\n      <path d=\"M54 44 L66 44\"><\u002Fpath>\n      <path d=\"M30 8 L36 5 M44 5 L50 8\" stroke-width=\"0.9\"><\u002Fpath>\n      <path d=\"M34 14 L46 14\" stroke-width=\"0.9\"><\u002Fpath>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <!-- PROGRAM -->\n  <section class=\"block reveal\">\n    <h2 class=\"block__title\">Программа<\u002Fh2>\n    <ul class=\"program\">\n      <li>\n        <span class=\"program__date\">18 сентября<\u002Fspan>\n        <span class=\"program__desc\">Заселение в коттеджи, ужин, по желанию — баня.<\u002Fspan>\n      <\u002Fli>\n      <li>\n        <span class=\"program__date\">19 сентября<\u002Fspan>\n        <span class=\"program__desc\">Завтрак, отдых, церемония, праздничный ужин и развлечения.<\u002Fspan>\n      <\u002Fli>\n      <li>\n        <span class=\"program__date\">20 сентября<\u002Fspan>\n        <span class=\"program__desc\">Завтрак, сборы, трансфер в Ереван.<\u002Fspan>\n      <\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <!-- doodle: dress + jacket (before Дресс-код) -->\n  <div class=\"doodle reveal\">\n    <svg width=\"110\" height=\"60\" viewBox=\"0 0 110 60\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <!-- jacket on the left -->\n      <path d=\"M14 10 L22 6 L30 10 L30 20 L36 24 L36 54 L8 54 L8 24 L14 20 Z\"><\u002Fpath>\n      <path d=\"M22 6 L22 20 L18 30 M22 20 L26 30\"><\u002Fpath>\n      <circle cx=\"22\" cy=\"34\" r=\"0.8\" fill=\"#111\"><\u002Fcircle>\n      <circle cx=\"22\" cy=\"42\" r=\"0.8\" fill=\"#111\"><\u002Fcircle>\n      <!-- dress on the right -->\n      <path d=\"M70 10 L78 6 L86 10 L84 18 L82 22 L96 54 L60 54 L74 22 L72 18 Z\"><\u002Fpath>\n      <path d=\"M78 6 L78 22\"><\u002Fpath>\n      <path d=\"M64 46 Q 78 50, 92 46\" stroke-width=\"0.9\"><\u002Fpath>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <!-- DRESS CODE -->\n  <section class=\"block reveal\">\n    <h2 class=\"block__title\">Дресс-код<\u002Fh2>\n    <p class=\"block__text\">\n      На Севане в сентябре ещё тепло (в районе 20 градусов днём), но может быть ветрено, и вечером холодает. Мы будем на природе и под открытым небом, так что в приоритете — ваше тепло и удобство.\n    <\u002Fp>\n    <p class=\"block__text\">\n      Если хотите вписываться в пейзаж, выбирайте природные оттенки, если хотите выделяться — выбирайте неон и ультрафиолет, мы всё поймём и оценим.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- doodle: branch (before Подарки) -->\n  <div class=\"doodle reveal\">\n    <svg width=\"200\" height=\"28\" viewBox=\"0 0 200 28\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M4 14 L196 14\"><\u002Fpath>\n      <path d=\"M30 14 Q 36 6, 46 8 M30 14 Q 36 22, 46 20\"><\u002Fpath>\n      <path d=\"M70 14 Q 76 6, 86 8 M70 14 Q 76 22, 86 20\"><\u002Fpath>\n      <path d=\"M110 14 Q 116 6, 126 8 M110 14 Q 116 22, 126 20\"><\u002Fpath>\n      <path d=\"M150 14 Q 156 6, 166 8 M150 14 Q 156 22, 166 20\"><\u002Fpath>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <!-- GIFTS -->\n  <section class=\"block reveal\">\n    <h2 class=\"block__title\">Подарки<\u002Fh2>\n    <p class=\"block__text\">\n      Наш главный подарок — ваше присутствие на нашем празднике. Мы понимаем, что вам и так придётся потратиться на билеты, и не ждём от вас ничего сверх этого.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- doodle: heart -->\n  <div class=\"doodle reveal\">\n    <svg width=\"36\" height=\"32\" viewBox=\"0 0 36 32\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M18 28 C 6 20, 2 12, 6 7 C 10 2, 16 4, 18 10 C 20 4, 26 2, 30 7 C 34 12, 30 20, 18 28 Z\"><\u002Fpath>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <!-- RSVP -->\n  <section class=\"block reveal\">\n    <h2 class=\"block__title\">Приедете?<\u002Fh2>\n    <p class=\"block__text\">\n      Пожалуйста, ответьте до 1 июля. Это поможет нам всё лучше продумать и организовать.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- COUNTDOWN -->\n  <section class=\"countdown reveal\">\n    <div class=\"countdown__grid\">\n      <div class=\"countdown__cell\">\n        <span class=\"countdown__num\" id=\"days\">—<\u002Fspan>\n        <span class=\"countdown__unit\">дней<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"countdown__cell\">\n        <span class=\"countdown__num\" id=\"hours\">—<\u002Fspan>\n        <span class=\"countdown__unit\">часов<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"countdown__cell\">\n        <span class=\"countdown__num\" id=\"minutes\">—<\u002Fspan>\n        <span class=\"countdown__unit\">минут<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"countdown__cell\">\n        <span class=\"countdown__num\" id=\"seconds\">—<\u002Fspan>\n        <span class=\"countdown__unit\">секунд<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"countdown__date\">до 18 сентября 2026<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer>\n    <svg width=\"60\" height=\"22\" viewBox=\"0 0 60 22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" stroke-linecap=\"round\">\n      <path d=\"M2 11 L58 11\"><\u002Fpath>\n      <circle cx=\"30\" cy=\"11\" r=\"1.6\" fill=\"#111\"><\u002Fcircle>\n    <\u002Fsvg>\n    <div class=\"sig\">Костя &amp; Настя<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<script>\n  const target = new Date('2026-09-18T16:00:00+04:00').getTime();\n  const $d = document.getElementById('days');\n  const $h = document.getElementById('hours');\n  const $m = document.getElementById('minutes');\n  const $s = document.getElementById('seconds');\n  const pad = n => String(n).padStart(2, '0');\n\n  function tick() {\n    const diff = target - Date.now();\n    if (diff <= 0) { $d.textContent = '0'; $h.textContent = '00'; $m.textContent = '00'; $s.textContent = '00'; return; }\n    $d.textContent = Math.floor(diff / 86400000);\n    $h.textContent = pad(Math.floor(diff / 3600000) % 24);\n    $m.textContent = pad(Math.floor(diff / 60000) % 60);\n    $s.textContent = pad(Math.floor(diff / 1000) % 60);\n  }\n  tick(); setInterval(tick, 1000);\n\n  const io = new IntersectionObserver(entries => {\n    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });\n  }, { threshold: 0.12 });\n  document.querySelectorAll('.reveal').forEach(el => io.observe(el));\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
